<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="10" fill="#0a0a0f"/>

  <!-- Neon green glow filter for > prompt -->
  <defs>
    <filter id="glow-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pixel-art ">" prompt — neon green -->
  <g filter="url(#glow-green)" fill="#00ff88">
    <!-- Top arm of > -->
    <rect x="10" y="16" width="4" height="4"/>
    <rect x="14" y="20" width="4" height="4"/>
    <rect x="18" y="24" width="4" height="4"/>
    <!-- Bottom arm of > -->
    <rect x="14" y="28" width="4" height="4"/>
    <rect x="10" y="32" width="4" height="4"/>
    <!-- Tip -->
    <rect x="22" y="28" width="3" height="4"/>
  </g>

  <!-- Pixel-art flag — cyan -->
  <g filter="url(#glow-cyan)" fill="#00e5ff">
    <!-- Pole -->
    <rect x="30" y="16" width="3" height="28"/>
    <!-- Flag body (waving) -->
    <rect x="33" y="16" width="16" height="4"/>
    <rect x="33" y="20" width="18" height="4"/>
    <rect x="33" y="24" width="16" height="4"/>
    <rect x="33" y="28" width="14" height="4"/>
    <!-- Wave cutout simulation -->
    <rect x="47" y="20" width="2" height="4" fill="#0a0a0f"/>
    <rect x="45" y="28" width="2" height="4" fill="#0a0a0f"/>
  </g>
</svg>