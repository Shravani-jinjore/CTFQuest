# Render Blueprint for CTFQuest
# Docs: https://render.com/docs/blueprint-spec

services:
  # ==========================================
  # Backend API & WebSocket Terminal Service
  # ==========================================
  - type: web
    name: ctfquest-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"

# ==========================================
# Frontend React SPA Static Site
# ==========================================
staticSites:
  - name: ctfquest-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ctfquest-backend
          property: host
          # Render automatically wires the backend URL here!
